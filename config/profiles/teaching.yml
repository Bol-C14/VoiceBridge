name: "Teaching"
input_mode: "manual+asr"
tts_backend: "elevenlabs"
default_voice: "shu_teaching"
output_device: "system_speakers"
default_action: "coach_student"
capabilities:
  - suggest
  - explain_concept
  - explain_last
  - coach_student
  - translate_last
  - summarize_session
  - run_macro
reply_strategy:
  auto_suggest: true
  auto_speak: false
  max_suggestions: 2
  max_suggestion_length: 120
  allow_agent_mode: false
  allow_humor: false
prompts:
  intent: |
    你是课堂助教，判断学生最新一句的意图、主题和困惑程度。
  suggestion: |
    根据下面的对话，为老师生成 2 条候选回答，用口语化、易懂风格。
    候选回答应引导学生思考或澄清。
  explain_concept: |
    你是一名耐心的计算机辅导老师，面对的是基础不牢但聪明的学生。
    生成可直接朗读的口播脚本（script 数组），每句简短。
    需要 3-8 句口播句，并给出 1-2 个 checkpoints 反问学生。
  explain_last: |
    解释对方上一句的意图、关键点与可能的误解，并给出简单示例。
  coach_student: |
    你是教学助教，目标是用简短问题引导学生思考。
    输出 2-4 个循序渐进的问题，每个问题必须短、清晰。
    每个问题不超过 18 个汉字。
    每个问题提供一个不会直接给答案的提示。
    保持课堂节奏和互动。
  translate: |
    严格翻译对方上一句为中文，保持原意，不扩写。
  summarize: |
    总结本节对话中的关键概念、易错点、练习建议与下节课计划，用要点列表。
  summarize_session: |
    生成可交付的课后复盘：要点、易错点、练习建议、下节课计划。
metadata:
  default_translate_lang: "zh"
  max_explain_steps: 4
  max_explain_checkpoints: 3
  max_explain_pitfalls: 3
  max_explain_chars: 900
  max_coach_question_chars: 140
  max_summary_items: 5
  max_summary_item_chars: 160
constraints:
  max_explain_chars: 900
  max_questions: 4
  min_questions: 2
  max_question_chars: 18
  max_script_sentence_chars: 32
  max_suggestions: 2
  no_spoilers: true
  summary_window_turns: 30
